<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Space Pathway Out of Service | Workspace Hub</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="404.css">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('nexus_theme') || 'light';
      const savedDir = localStorage.getItem('nexus_dir') || 'ltr';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.setAttribute('dir', savedDir);
    })();
  </script>
</head>
<body class="err-body">
  <div class="err-bg-ambient err-bg-ambient-left" aria-hidden="true"></div>
  <div class="err-bg-ambient err-bg-ambient-right" aria-hidden="true"></div>

  <header class="err-top-bar">
    <a href="index.html" class="err-brand-shortcut" aria-label="Workspace Hub Home">
      <img src="assets/logo.png" alt="Workspace Hub" class="err-brand-img">
      <div class="err-brand-text">
        <span class="err-brand-name">WORKSPACE HUB</span>
        <span class="err-brand-sub">CO-WORK &amp; STUDY</span>
      </div>
    </a>
    <div class="err-top-actions">
      <button id="errDirBtn" class="err-icon-circle-btn" aria-label="Toggle text direction" title="Toggle RTL/LTR">
        <span class="err-dir-text">LTR</span>
      </button>
      <button id="errThemeBtn" class="err-icon-circle-btn" aria-label="Toggle light and dark mode" title="Toggle Theme">
        <svg class="err-sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="err-moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="err-stage">
    <div class="err-stage-content">
      
      <div class="err-visual-anchor">
        <div class="err-round-avatar">
          <img src="assets/gallery-focus.jpg" alt="Study focus space" class="err-avatar-photo">
        </div>

        <div class="err-digits-row">
          <span class="err-digit-glyph">4</span>
          <div class="err-digit-circle">
            <svg class="err-center-icon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <span class="err-digit-glyph">4</span>
        </div>
        <div class="err-ground-shadow" aria-hidden="true"></div>
      </div>

      <section class="err-content-card">
        <div class="err-status-pill">
          <svg class="err-pill-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
          </svg>
          <span>WORKSPACE ROUTE NOT FOUND</span>
        </div>

        <h1 class="err-title-text">This Space Pathway Is Out of Service</h1>

        <p class="err-lead-text">
          The page you are looking for may have been relocated, reserved, or does not exist. Let us guide you back to our professional study desks and co-working spaces.
        </p>

        <div class="err-buttons-row">
          <a href="index.html" class="err-btn-main">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Back to Home</span>
          </a>

          <a href="Services.html" class="err-btn-sub">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
            </svg>
            <span>Explore Spaces</span>
          </a>
        </div>
      </section>

    </div>
  </main>

  <script src="404.js"></script>
</body>
</html>
